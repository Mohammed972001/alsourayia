# Build -> deploy to Cloudflare Workers (OpenNext) on every push to main.
# Public repo, so Actions minutes are free; still one Linux job, docs-only pushes
# skipped, older runs cancelled and a hard timeout. The build is the type-check
# (there is no ESLint setup in this repo).
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - run: npm run deploy
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Public values rendered into the pages (Analytics and Ads ids).
          NEXT_PUBLIC_GA4_ID: "G-VBQKQP75E9"
          NEXT_PUBLIC_ADS_ID: "AW-18482544361"
          NEXT_PUBLIC_ADS_LABEL_CALL: "GTDECIvwlp4dEOn9lO1E"
          NEXT_PUBLIC_ADS_LABEL_WHATSAPP: "ZyWkCIjwlp4dEOn9lO1E"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
