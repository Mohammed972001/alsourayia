# Build the static export -> deploy to Cloudflare Workers on every push to main (ADR-0001).
# Public repo, so Actions minutes are free; still one Linux job, docs-only pushes skipped, older runs
# cancelled and a hard timeout.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
      - "specs/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run tokens

      # The live build: indexing on, Google tag and TikTok pixel on.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SITE_LIVE: "1"

      - run: npm run check
        env:
          SITE_LIVE: "1"

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Tell Bing (ChatGPT search reads its index) about the pages just deployed.
      - run: node scripts/indexnow.mjs
        continue-on-error: true
